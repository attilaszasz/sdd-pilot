name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-drift-report:
    name: Validate Wrapper Drift Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate drift report
        run: node scripts/drift-report.mjs --output .build/drift-report --strict

      - name: Run contract tests
        run: node --test tests/*.test.mjs

      - name: Verify gated markdown compression
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { GOVERNANCE_COMPRESSION_TARGETS } from './scripts/lib/markdown-compression.mjs';

          for (const target of GOVERNANCE_COMPRESSION_TARGETS) {
            const result = spawnSync(process.execPath, ['scripts/compress-markdown.mjs', '--idempotent', target], {
              stdio: 'inherit',
            });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE

      - name: Publish drift report summary
        if: always()
        run: |
          if [ -f .build/drift-report/drift-report.md ]; then
            cat .build/drift-report/drift-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Drift report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
